<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senin İçin Kodladım</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="ac-btn"> :)) 🌸</button>
    <canvas id="canvas"></canvas>
    <div class="mesaj" id="mesaj">Herkes çiçek alır, ben senin için kodladım</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const acBtn = document.getElementById('ac-btn');
        const mesaj = document.getElementById('mesaj');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let basladi = false;
        let originX = canvas.width / 2;
        let originY = canvas.height / 2;

        const mouse = {
            x: null,
            y: null,
            radius: 55
        };

        window.addEventListener('mousemove', (e) => {
            if (!basladi) return;
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('touchmove', (e) => {
            if (!basladi) return;
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        window.addEventListener('touchend', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor(x, y, color, startX, startY) {
                
                this.x = startX + (Math.random() - 0.5) * 30;
                this.y = startY + (Math.random() - 0.5) * 20;
                this.baseX = x;
                this.baseY = y;
                this.size = Math.random() * 2 + 1.2;
                this.color = color;
                this.density = (Math.random() * 26) + 6;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.88;
                this.vy *= 0.88;

                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let force = (mouse.radius - distance) / mouse.radius;
                        this.x -= forceDirectionX * force * this.density;
                        this.y -= forceDirectionY * force * this.density;
                        return;
                    }
                }

                this.x += (this.baseX - this.x) * 0.065;
                this.y += (this.baseY - this.y) * 0.065;
            }
        }

        function drawLeaf(ctx, x, y, rx, ry, angle, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawRose(ctx, x, y, radius, palette) {
            ctx.save();
            ctx.translate(x, y);

            const outerCount = 8;
            for (let i = 0; i < outerCount; i++) {
                const a = (i / outerCount) * Math.PI * 2;
                ctx.save();
                ctx.rotate(a);
                ctx.fillStyle = palette[0];
                ctx.beginPath();
                ctx.ellipse(0, -radius * 0.55, radius * 0.48, radius * 0.34, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            const midCount = 6;
            for (let i = 0; i < midCount; i++) {
                const a = (i / midCount) * Math.PI * 2 + 0.4;
                ctx.save();
                ctx.rotate(a);
                ctx.fillStyle = palette[1];
                ctx.beginPath();
                ctx.ellipse(0, -radius * 0.32, radius * 0.38, radius * 0.26, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.fillStyle = palette[2];
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.34, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = palette[3];
            ctx.lineWidth = Math.max(2, radius * 0.06);
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.18, 0, Math.PI * 1.5);
            ctx.stroke();

            ctx.restore();
        }

        function createBouquetParticles(startX, startY) {
            particles = [];
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;

            const scale = Math.min(canvas.width / 720, canvas.height / 640) * 1.45;
            const clampedScale = Math.max(1.25, Math.min(scale, 1.85));

            const cx = canvas.width / 2;
            const cy = canvas.height / 2 - 55 * clampedScale;

            offCtx.save();
            offCtx.translate(cx, cy);
            offCtx.scale(clampedScale, clampedScale);

            offCtx.fillStyle = '#efe3d0';
            offCtx.beginPath();
            offCtx.moveTo(-145, -35);
            offCtx.quadraticCurveTo(0, -10, 145, -35);
            offCtx.lineTo(12, 215);
            offCtx.quadraticCurveTo(0, 225, -12, 215);
            offCtx.closePath();
            offCtx.fill();

            offCtx.strokeStyle = '#3d7a37';
            offCtx.lineWidth = 5;
            [-55, -28, 0, 28, 55].forEach(dx => {
                offCtx.beginPath();
                offCtx.moveTo(dx * 0.2, 175);
                offCtx.quadraticCurveTo(dx * 0.7, 75, dx, -20);
                offCtx.stroke();
            });

            const leafList = [
                { x: -105, y: -35, rx: 34, ry: 15, rot: -0.6, col: '#4e8d42' },
                { x: 105,  y: -35, rx: 34, ry: 15, rot: 0.6, col: '#4e8d42' },
                { x: -88,  y: 15,  rx: 30, ry: 14, rot: -0.35, col: '#3c7634' },
                { x: 88,   y: 15,  rx: 30, ry: 14, rot: 0.35, col: '#3c7634' },
                { x: -55,  y: -95, rx: 32, ry: 14, rot: -0.85, col: '#5aa14b' },
                { x: 55,   y: -95, rx: 32, ry: 14, rot: 0.85, col: '#5aa14b' },
                { x: 0,    y: -110, rx: 34, ry: 15, rot: 0, col: '#4e8d42' }
            ];
            leafList.forEach(l => drawLeaf(offCtx, l.x, l.y, l.rx, l.ry, l.rot, l.col));

            const rosePalette = ['#d85a7f', '#e87a99', '#f4a4ba', '#b83b60'];
            const deepRosePalette = ['#b83b60', '#d85a7f', '#eb88a3', '#8f2444'];

            const roses = [
                { x: 0,    y: -75, r: 30, pal: deepRosePalette },
                { x: -52,  y: -58, r: 32, pal: rosePalette },
                { x: 52,   y: -58, r: 32, pal: rosePalette },
                { x: -72,  y: -15, r: 31, pal: deepRosePalette },
                { x: 72,   y: -15, r: 31, pal: deepRosePalette },
                { x: 0,    y: -28, r: 36, pal: rosePalette },
                { x: -32,  y: 18,  r: 32, pal: rosePalette },
                { x: 32,   y: 18,  r: 32, pal: rosePalette },
                { x: 0,    y: 36,  r: 29, pal: deepRosePalette }
            ];
            roses.forEach(rose => drawRose(offCtx, rose.x, rose.y, rose.r, rose.pal));

            offCtx.fillStyle = '#f7efe1';
            offCtx.beginPath();
            offCtx.moveTo(-115, 45);
            offCtx.quadraticCurveTo(0, 72, 115, 45);
            offCtx.lineTo(12, 215);
            offCtx.quadraticCurveTo(0, 225, -12, 215);
            offCtx.closePath();
            offCtx.fill();

            offCtx.fillStyle = '#c24168';
            offCtx.beginPath();
            offCtx.arc(0, 125, 11, 0, Math.PI * 2);
            offCtx.fill();

            offCtx.beginPath();
            offCtx.moveTo(0, 125);
            offCtx.lineTo(-38, 108);
            offCtx.lineTo(-30, 142);
            offCtx.closePath();
            offCtx.fill();

            offCtx.beginPath();
            offCtx.moveTo(0, 125);
            offCtx.lineTo(38, 108);
            offCtx.lineTo(30, 142);
            offCtx.closePath();
            offCtx.fill();

            offCtx.restore();

            const imageData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
            const gap = 4;

            for (let y = 0; y < imageData.height; y += gap) {
                for (let x = 0; x < imageData.width; x += gap) {
                    const index = (y * imageData.width + x) * 4;
                    const alpha = imageData.data[index + 3];
                    if (alpha > 128) {
                        const r = imageData.data[index];
                        const g = imageData.data[index + 1];
                        const b = imageData.data[index + 2];
                        particles.push(new Particle(x, y, `rgb(${r},${g},${b})`, startX, startY));
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (basladi) {
                for (let i = 0; i < particles.length; i++) {
                    particles[i].draw();
                    particles[i].update();
                }
            }
            requestAnimationFrame(animate);
        }

        acBtn.addEventListener('click', () => {
            if (basladi) return;
            const rect = acBtn.getBoundingClientRect();
            originX = rect.left + rect.width / 2;
            originY = rect.top + rect.height / 2;

            acBtn.classList.add('gizle');
            mesaj.classList.add('goster');

            createBouquetParticles(originX, originY);
            basladi = true;
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (basladi) {
                createBouquetParticles(canvas.width / 2, canvas.height / 2);
            }
        });

        animate();
    </script>
    <address class="adres"><i>Powered By Emir Kaş</i></address>
</body>
</html>
